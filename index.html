<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面包板电路搭建</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px 12px 18px;
            min-height: 100vh;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        .canvas-container {
            background: white;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            width: min(96vw, 1420px);
            box-sizing: border-box;
        }
        .canvas-container svg {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;
        }
        .controls {
            display: flex;
            gap: 18px;
            align-items: center;
            background: white;
            padding: 14px 28px;
            border-radius: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            z-index: 10;
            width: min(96vw, 1320px);
            box-sizing: border-box;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #0078d4;
            color: white;
            transition: all 0.2s ease;
        }
        button:hover:not(:disabled) {
            background-color: #005a9e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,120,212,0.3);
        }
        button:disabled {
            background-color: #e1e1e1;
            color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #step-description {
            font-size: 17px;
            font-weight: 600;
            color: #2c3e50;
            flex: 1;
            width: auto;
            text-align: center;
            line-height: 1.5;
        }

        .step-el {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        .step-el.active {
            opacity: 1;
        }
        
        .wire-draw {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            transition: stroke-dashoffset 0.8s ease-in-out;
        }
        .step-el.active .wire-draw {
            stroke-dashoffset: 0;
        }
        
        .r1-pin { transition: d 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .r1-body { transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); }

        .led-glow, .led-core { pointer-events: none; }
        .led-glow.off { opacity: 0; r: 0; transition: opacity 0.2s, r 0.2s; }
        .led-core.off { opacity: 0; r: 0; transition: opacity 0.2s, r 0.2s; }
        
        /* 1kΩ 限流微亮 */
        .led-glow.on-dim { opacity: 0.5; r: 14; transition: opacity 0.1s; fill: #ff6666; }
        .led-core.on-dim { opacity: 0.6; r: 4; transition: opacity 0.1s; fill: #ffffff; }

        /* 瞬间高亮 (基础点灯 & Exp 2-1) */
        .led-glow.on-bright { opacity: 0.9; r: 22; transition: opacity 0.1s; fill: #ff0000; }
        .led-core.on-bright { opacity: 0.9; r: 7; transition: opacity 0.1s; fill: #ffffff; }

        /* Exp 2-1：为课堂观察适度放慢熄灭动画（演示时长，不等同实际 RC 时间常数） */
        .led-glow.fade-slow { opacity: 0; r: 0; transition: opacity 4.2s ease-out, r 4.2s ease-out; fill: #ff0000; }
        .led-core.fade-slow { opacity: 0; r: 0; transition: opacity 4.2s ease-out, r 4.2s ease-out; fill: #ffffff; }

        /* Exp 2-2：为课堂观察适度放慢渐亮动画 */
        .led-glow.on-delay { opacity: 0.85; r: 20; transition: opacity 2.8s ease-in 0.6s, r 2.8s ease-in 0.6s; fill: #ff0000; }
        .led-core.on-delay { opacity: 0.85; r: 6; transition: opacity 2.8s ease-in 0.6s, r 2.8s ease-in 0.6s; fill: #ffffff; }

        /* Exp 2-2：放电路径少一个 R2，仍保持比 Exp 2-1 更快 */
        .led-glow.fade-fast { opacity: 0; r: 0; transition: opacity 2.3s ease-out, r 2.3s ease-out; fill: #ff0000; }
        .led-core.fade-fast { opacity: 0; r: 0; transition: opacity 2.3s ease-out, r 2.3s ease-out; fill: #ffffff; }

        .bb-bg { fill: #fdfdfd; stroke: #d0d0d0; stroke-width: 2; }
        .bb-trench { fill: #e8e8e8; }
        .hole { fill: #1a1a1a; }
        .hole-highlight { fill: rgba(0,0,0,0.3); }
        .rail-red { stroke: #e74c3c; stroke-width: 2.5; stroke-linecap: round; }
        .rail-blue { stroke: #3498db; stroke-width: 2.5; stroke-linecap: round; }
        .bb-text { font-family: monospace; font-size: 11px; fill: #888; text-anchor: middle; font-weight: bold;}
        
        .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .red-wire { stroke: #e74c3c; }
        .black-wire { stroke: #2c3e50; }
        .jumper-wire { stroke: #1e3a8a; } /* 统一深蓝色跳线 */
        
        .label-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: bold; fill: #333; transition: all 0.3s;}

        #r1-target-hole,
        #r1-target-ring {
            display: none;
        }

        .current-flow {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            --flow-dur: 6.0s;
        }
        .current-flow.active { opacity: 1; }
        .current-flow.transient {
            animation: flowTransient 4.8s ease-out forwards;
        }
        .current-flow.speed-fast { --flow-dur: 5.0s; }
        .current-flow.speed-medium { --flow-dur: 6.3s; }
        .current-flow.speed-slow { --flow-dur: 7.8s; }

        .current-trail {
            fill: none;
            stroke: rgba(255, 225, 72, 0.95);
            stroke-width: 5.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 0.1 15;
            animation: flowMove var(--flow-dur) linear infinite;
        }
        .current-trail.secondary {
            stroke: rgba(255, 232, 108, 0.75);
            stroke-width: 5.0;
            animation-delay: calc(var(--flow-dur) * -0.33);
        }
        .current-trail.tertiary {
            stroke: rgba(255, 239, 150, 0.55);
            stroke-width: 4.3;
            animation-delay: calc(var(--flow-dur) * -0.66);
        }
        @keyframes flowMove {
            from { stroke-dashoffset: 0; }
            to   { stroke-dashoffset: -180; }
        }
        @keyframes flowTransient {
            0%, 60% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <svg width="1280" height="600" viewBox="0 0 900 420" id="circuit-svg">
            <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.3" />
                </filter>
                <filter id="inner-shadow">
                    <feOffset dx="0" dy="1"/>
                    <feGaussianBlur stdDeviation="1" result="offset-blur"/>
                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                    <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
                    <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                    <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                </filter>

                <path id="flow-path-basic" d="M 100 200 C 140 200, 150 60, 202 60 L 298 60 C 268 132, 266 88, 298 142 L 298 158 L 314 158 L 314 110 Q 314 90 356 95 L 400 95 Q 442 90 442 110 L 442 174 L 468 194 L 468 202 L 442 222 L 442 286 C 464 296, 464 312, 442 320 L 202 320 C 150 320, 140 220, 100 220" />
                <path id="flow-path-exp21-charge" d="M 100 200 C 140 200, 150 60, 202 60 L 298 60 C 268 132, 266 88, 298 142 L 298 158 L 314 158 L 314 142 Q 314 125 332 120 L 376 120 Q 394 125 394 142 L 394 174 L 368 188 L 368 207 L 394 222 L 394 286 C 416 296, 416 312, 394 320 L 202 320 C 150 320, 140 220, 100 220" />
                <path id="flow-path-exp21-discharge" d="M 394 174 L 368 188 L 368 207 L 394 222 L 394 286 C 416 296, 416 312, 394 320 L 442 320 L 442 286 C 464 296, 464 312, 442 320 L 442 222 L 468 202 L 468 194 L 442 174 L 442 110 Q 442 90 400 95 L 356 95 Q 314 90 314 110 L 314 142 Q 314 125 332 120 L 376 120 Q 394 125 394 142 L 394 174" />
                <path id="flow-path-exp22-steady" d="M 100 200 C 140 200, 150 60, 202 60 L 298 60 C 268 132, 266 88, 298 142 L 298 158 L 314 158 L 314 142 Q 314 125 332 120 L 376 120 Q 394 125 394 142 L 394 110 Q 394 98 396 95 L 440 95 Q 442 98 442 110 L 442 174 L 468 194 L 468 202 L 442 222 L 442 286 C 464 296, 464 312, 442 320 L 202 320 C 150 320, 140 220, 100 220" />
                <path id="flow-path-exp22-charge" d="M 100 200 C 140 200, 150 60, 202 60 L 298 60 C 268 132, 266 88, 298 142 L 298 158 L 314 158 L 314 142 Q 314 125 332 120 L 376 120 Q 394 125 394 142 L 394 174 L 368 188 L 368 207 L 394 222 L 394 286 C 416 296, 416 312, 394 320 L 202 320 C 150 320, 140 220, 100 220" />
                <path id="flow-path-exp22-discharge" d="M 394 174 L 368 188 L 368 207 L 394 222 L 394 286 C 416 296, 416 312, 394 320 L 442 320 L 442 286 C 464 296, 464 312, 442 320 L 442 222 L 468 202 L 468 194 L 442 174 L 442 110 Q 442 98 440 95 L 396 95 Q 394 98 394 110 L 394 174" />
            </defs>

            <g id="power-source" filter="url(#drop-shadow)" transform="translate(15, 160)">
                <rect x="0" y="0" width="100" height="70" fill="#2c3e50" rx="6" />
                <rect x="0" y="0" width="100" height="25" fill="#1a252f" rx="6" />
                <text x="50" y="17" fill="white" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="4">电 源</text>
                
                <circle cx="85" cy="40" r="5" fill="#e74c3c" />
                <text x="65" y="45" fill="#e74c3c" font-weight="bold" font-size="16">＋</text>
                
                <circle cx="85" cy="60" r="5" fill="#95a5a6" />
                <text x="65" y="65" fill="#95a5a6" font-weight="bold" font-size="16">－</text>
            </g>

            <!-- 由 JS 动态注入高拟真面包板 -->
            <g id="breadboard-group" filter="url(#drop-shadow)"></g>

            <g id="step1" class="step-el">
                <!-- 红线连顶排 (第3列) -->
                <path d="M 100 200 C 140 200, 150 60, 202 60" class="wire red-wire wire-draw" />
                <circle cx="202" cy="60" r="3.5" class="hole-highlight" />
            </g>
            <g id="step2" class="step-el">
                <!-- 黑线连底排 (第3列) -->
                <path d="M 100 220 C 140 220, 150 320, 202 320" class="wire black-wire wire-draw" />
                <circle cx="202" cy="320" r="3.5" class="hole-highlight" />
            </g>

            <!-- 开关中心在 col 9 (x=298), 输出端在 col 10 (x=314) -->
            <g id="step3" class="step-el">
                <!-- 开关主体置于 a-e 区域 -->
                <circle cx="282" cy="158" r="3.5" class="hole-highlight" />
                <circle cx="298" cy="158" r="3.5" class="hole-highlight" />
                <circle cx="314" cy="158" r="3.5" class="hole-highlight" />
                
                <g filter="url(#drop-shadow)">
                    <path d="M 282 170 L 282 158" stroke="#95a5a6" stroke-width="3" stroke-linecap="round" />
                    <path d="M 298 170 L 298 158" stroke="#95a5a6" stroke-width="3" stroke-linecap="round" />
                    <path d="M 314 170 L 314 158" stroke="#95a5a6" stroke-width="3" stroke-linecap="round" />
                    <rect x="272" y="165" width="52" height="24" fill="#f0f0f0" rx="3" stroke="#bdc3c7" />
                    <rect x="283" y="171" width="30" height="12" fill="#2c3e50" rx="2" />
                    <rect id="switch-slider" x="285" y="172" width="12" height="10" fill="#7f8c8d" rx="2" style="transition: transform 0.4s ease;" />
                </g>
                <text x="298" y="202" class="label-text" text-anchor="middle">开关S</text>
            </g>

            <g id="step4" class="step-el">
                <path d="M 298 142 C 268 132, 266 88, 298 60" class="wire jumper-wire wire-draw" />
                <circle cx="298" cy="142" r="3.5" class="hole-highlight" />
                <circle cx="298" cy="60" r="3.5" class="hole-highlight" />
            </g>

            <!-- 起点 col 10 (314), 终点 col 18 (442) -->
            <g id="step5" class="step-el" style="transition: opacity 0.4s;">
                <!-- 深绿色引脚，对称排布 -->
                <path d="M 314 110 Q 314 90 356 95" fill="none" stroke="#27ae60" stroke-width="2.5" class="wire-draw" />
                <path d="M 442 110 Q 442 90 400 95" fill="none" stroke="#27ae60" stroke-width="2.5" class="wire-draw" />
                <circle cx="314" cy="110" r="3.5" class="hole-highlight" />
                <circle cx="442" cy="110" r="3.5" class="hole-highlight" />
                
                <g filter="url(#drop-shadow)">
                    <!-- 1kΩ: 棕黑黑棕棕 -->
                    <rect x="356" y="90" width="44" height="10" fill="#E8C396" rx="3" />
                    <rect x="360" y="90" width="3" height="10" fill="#8B4513" />
                    <rect x="368" y="90" width="3" height="10" fill="#000000" />
                    <rect x="376" y="90" width="3" height="10" fill="#000000" />
                    <rect x="384" y="90" width="3" height="10" fill="#8B4513" />
                    <rect x="392" y="90" width="3" height="10" fill="#8B4513" />
                </g>
                <rect x="350" y="68" width="56" height="18" fill="rgba(255,255,255,0.92)" stroke="#e0e0e0" rx="4" />
                <text x="378" y="81" class="label-text" fill="#8B4513" text-anchor="middle">R=1kΩ</text>
            </g>

            <g id="step6" class="step-el">
                <!-- 保留原 LED 外观；两根引脚直接插入同一列上下两孔，不再做折弯 -->
                <path d="M 442 174 L 468 194" fill="none" stroke="#7f8c8d" stroke-width="2.8" class="wire-draw" />
                <path d="M 442 222 L 468 202" fill="none" stroke="#7f8c8d" stroke-width="2.8" class="wire-draw" />
                <circle cx="442" cy="174" r="3.5" class="hole-highlight" />
                <circle cx="442" cy="222" r="3.5" class="hole-highlight" />
                
                <g filter="url(#drop-shadow)">
                    <rect x="465" y="142" width="4" height="16" fill="#900" rx="1" transform="translate(0, 48)" />
                    <path d="M 468 191 C 486 191, 486 205, 468 205 Z" fill="#c0392b" />
                </g>
                <rect x="492" y="189" width="34" height="18" fill="rgba(255,255,255,0.9)" stroke="#e0e0e0" rx="4" />
                <text x="509" y="202" class="label-text" text-anchor="middle">LED</text>
            </g>

            <g id="step7" class="step-el">
                <path d="M 442 286 C 464 296, 464 312, 442 320" class="wire jumper-wire wire-draw" />
                <circle cx="442" cy="286" r="3.5" class="hole-highlight" />
                <circle cx="442" cy="320" r="3.5" class="hole-highlight" />
            </g>

            <g id="r1-220-group" class="step-el">
                <!-- 动态左右引脚，通过 JS 控制 path d 以实现扭变 -->
                <path id="r1-left-pin" d="M 314 110 Q 314 90 356 95" fill="none" stroke="#27ae60" stroke-width="2.5" class="r1-pin" />
                <path id="r1-right-pin" d="M 442 110 Q 442 90 400 95" fill="none" stroke="#27ae60" stroke-width="2.5" class="r1-pin" />
                
                <!-- 目标孔位高亮占位 -->
                <circle cx="314" cy="110" r="3.5" class="hole-highlight" />
                <circle id="r1-target-hole" cx="394" cy="110" r="4.5" style="opacity: 0;" />
                <circle id="r1-target-ring" cx="394" cy="110" r="10" fill="none" stroke="#f1c40f" stroke-width="2.5" style="opacity: 0;" />
                <circle cx="442" cy="110" r="3.5" class="hole-highlight" />
                
                <!-- R1 阻体与标签，通过 CSS Transform 实现平移避让 -->
                <g id="r1-body" class="r1-body" filter="url(#drop-shadow)">
                    <!-- 220Ω: 红红黑黑棕 -->
                    <rect x="356" y="90" width="44" height="10" fill="#E8C396" rx="3" />
                    <rect x="360" y="90" width="3" height="10" fill="#c0392b" />
                    <rect x="368" y="90" width="3" height="10" fill="#c0392b" />
                    <rect x="376" y="90" width="3" height="10" fill="#000000" />
                    <rect x="384" y="90" width="3" height="10" fill="#000000" />
                    <rect x="392" y="90" width="3" height="10" fill="#8B4513" />
                    
                    <rect x="350" y="68" width="56" height="18" fill="rgba(255,255,255,0.92)" stroke="#e0e0e0" rx="4" />
                    <text id="r1-label" x="378" y="81" class="label-text" fill="#c0392b" text-anchor="middle">R=220Ω</text>
                </g>
            </g>

            <!-- R2: col 10 (314) -> col 15 (394) -->
            <g id="step11" class="step-el">
                <!-- R2 置于行 c；缩短一列并将标签放到下方，减少对 R1 的遮挡 -->
                <path d="M 314 142 Q 314 125 332 120" fill="none" stroke="#27ae60" stroke-width="2.5" class="wire-draw" />
                <path d="M 394 142 Q 394 125 376 120" fill="none" stroke="#27ae60" stroke-width="2.5" class="wire-draw" />
                <circle cx="314" cy="142" r="3.5" class="hole-highlight" />
                <circle cx="394" cy="142" r="3.5" class="hole-highlight" />
                
                <g filter="url(#drop-shadow)">
                    <rect x="332" y="115" width="44" height="10" fill="#E8C396" rx="3" />
                    <rect x="336" y="115" width="3" height="10" fill="#c0392b" />
                    <rect x="344" y="115" width="3" height="10" fill="#c0392b" />
                    <rect x="352" y="115" width="3" height="10" fill="#000000" />
                    <rect x="360" y="115" width="3" height="10" fill="#000000" />
                    <rect x="368" y="115" width="3" height="10" fill="#8B4513" />
                </g>
                <rect x="326" y="128" width="56" height="18" fill="rgba(255,255,255,0.92)" stroke="#e0e0e0" rx="4" />
                <text x="354" y="141" class="label-text" fill="#c0392b" text-anchor="middle">R2=220Ω</text>
            </g>

            <!-- 电容: 正负极位于中央沟槽上下同一列；主体翻转到左侧，避开 LED -->
            <g id="step12" class="step-el">
                <!-- 保留原电容外观；翻转方向以减少对 LED 的遮挡 -->
                <path d="M 394 174 L 368 188" fill="none" stroke="#7f8c8d" stroke-width="2.8" class="wire-draw" />
                <path d="M 394 222 L 368 207" fill="none" stroke="#7f8c8d" stroke-width="2.8" class="wire-draw" />
                <circle cx="394" cy="174" r="3.5" class="hole-highlight" />
                <circle cx="394" cy="222" r="3.5" class="hole-highlight" />
                
                <g filter="url(#drop-shadow)">
                    <rect x="344" y="180" width="24" height="35" fill="#0b3d91" />
                    <rect x="360" y="180" width="6" height="35" fill="#bdc3c7" />
                    <ellipse cx="356" cy="215" rx="12" ry="4" fill="#082b66" />
                    <ellipse cx="356" cy="180" rx="12" ry="4" fill="#1a53b8" />
                </g>
                <text x="352" y="202" fill="white" font-size="9" font-family="sans-serif" font-weight="bold" transform="rotate(-90 352 202)" text-anchor="middle">1000µF</text>
                
                <!-- 负极所在列在下半区，经同列跳线接到底部负轨 -->
                <path d="M 394 286 C 416 296, 416 312, 394 320" class="wire jumper-wire wire-draw" />
                <circle cx="394" cy="286" r="3.5" class="hole-highlight" />
                <circle cx="394" cy="320" r="3.5" class="hole-highlight" />
                
                <rect x="324" y="222" width="64" height="18" fill="rgba(255,255,255,0.92)" stroke="#e0e0e0" rx="4" />
                <text x="356" y="235" class="label-text" fill="#2c3e50" text-anchor="middle">C=1000μF</text>
            </g>

            <g id="flow-basic" class="current-flow speed-fast">
                <use href="#flow-path-basic" class="current-trail" />
                <use href="#flow-path-basic" class="current-trail secondary" />
                <use href="#flow-path-basic" class="current-trail tertiary" />
            </g>
            <g id="flow-exp21-charge" class="current-flow speed-slow">
                <use href="#flow-path-exp21-charge" class="current-trail" />
                <use href="#flow-path-exp21-charge" class="current-trail secondary" />
                <use href="#flow-path-exp21-charge" class="current-trail tertiary" />
            </g>
            <g id="flow-exp21-discharge" class="current-flow speed-medium">
                <use href="#flow-path-exp21-discharge" class="current-trail" />
                <use href="#flow-path-exp21-discharge" class="current-trail secondary" />
                <use href="#flow-path-exp21-discharge" class="current-trail tertiary" />
            </g>
            <g id="flow-exp22-steady" class="current-flow speed-medium">
                <use href="#flow-path-exp22-steady" class="current-trail" />
                <use href="#flow-path-exp22-steady" class="current-trail secondary" />
                <use href="#flow-path-exp22-steady" class="current-trail tertiary" />
            </g>
            <g id="flow-exp22-charge" class="current-flow speed-slow">
                <use href="#flow-path-exp22-charge" class="current-trail" />
                <use href="#flow-path-exp22-charge" class="current-trail secondary" />
                <use href="#flow-path-exp22-charge" class="current-trail tertiary" />
            </g>
            <g id="flow-exp22-discharge" class="current-flow speed-medium">
                <use href="#flow-path-exp22-discharge" class="current-trail" />
                <use href="#flow-path-exp22-discharge" class="current-trail secondary" />
                <use href="#flow-path-exp22-discharge" class="current-trail tertiary" />
            </g>

            <circle id="led-glow-effect" cx="474" cy="198" r="0" class="led-glow off" filter="url(#glow)" />
            <circle id="led-core-effect" cx="474" cy="198" r="0" class="led-core off" filter="url(#glow)" />

        </svg>
    </div>

    <div class="controls">
        <button id="prev-btn" onclick="prevStep()">上一步</button>
        <div id="step-description">初始状态：准备好面包板与直流电源</div>
        <button id="next-btn" onclick="nextStep()">下一步</button>
    </div>

    <script>
        const bbGroup = document.getElementById('breadboard-group');
        let bbHTML = '';
        
        const startX = 140, width = 560, height = 340, startY = 30;
        bbHTML += `<rect x="${startX}" y="${startY}" width="${width}" height="${height}" rx="12" class="bb-bg" />`;
        bbHTML += `<rect x="${startX}" y="192" width="${width}" height="12" class="bb-trench" filter="url(#inner-shadow)" />`;

        bbHTML += `<line x1="160" y1="48" x2="680" y2="48" class="rail-red" />`;
        bbHTML += `<line x1="160" y1="88" x2="680" y2="88" class="rail-blue" />`;
        bbHTML += `<line x1="160" y1="308" x2="680" y2="308" class="rail-blue" />`;
        bbHTML += `<line x1="160" y1="348" x2="680" y2="348" class="rail-red" />`;

        const gridStartX = 170, pitch = 16;
        const getX = (col) => gridStartX + (col - 1) * pitch;
        
        const hole = (x, y) => `
            <rect x="${x-3.5}" y="${y-3.5}" width="7" height="7" rx="1.5" class="hole" />
            <rect x="${x-3.5}" y="${y-3.5}" width="7" height="7" rx="1.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
        `;

        const rowY = {
            topPlus: 60, topMinus: 76,
            a: 110, b: 126, c: 142, d: 158, e: 174,
            f: 222, g: 238, h: 254, i: 270, j: 286,
            botMinus: 320, botPlus: 336
        };

        const addLetters = (xPos) => {
            ['a','b','c','d','e'].forEach(l => bbHTML += `<text x="${xPos}" y="${rowY[l] + 3}" class="bb-text">${l}</text>`);
            ['f','g','h','i','j'].forEach(l => bbHTML += `<text x="${xPos}" y="${rowY[l] + 3}" class="bb-text">${l}</text>`);
        };
        addLetters(155); addLetters(685); 

        for(let c = 1; c <= 30; c++) {
            let cx = getX(c);
            ['a','b','c','d','e','f','g','h','i','j'].forEach(r => bbHTML += hole(cx, rowY[r]));
            if (c % 6 !== 0) {
                bbHTML += hole(cx, rowY.topPlus) + hole(cx, rowY.topMinus) + hole(cx, rowY.botMinus) + hole(cx, rowY.botPlus);
            }
            if (c === 1 || c % 5 === 0) {
                bbHTML += `<text x="${cx}" y="98" class="bb-text">${c}</text>`;
                bbHTML += `<text x="${cx}" y="300" class="bb-text">${c}</text>`;
            }
        }
        bbGroup.innerHTML = bbHTML;

        const steps = [
            "准备面包板与直流电源",
            "① 电源正极接顶端正电源轨",
            "② 电源负极接底端负电源轨",
            "③ 插入三脚两档开关 S",
            "④ 开关中间脚接正电源轨",
            "⑤ 接入 R=1kΩ 电阻",
            "⑥ 接入红色 LED：长脚接电阻一侧，LED 跨中央沟槽",
            "⑦ LED 负极所在列接负电源轨",
            "⑧ 闭合开关：LED 微亮",
            "⑨ 断开开关：LED 熄灭",
            "⑩ 将 1kΩ 更换为 220Ω，闭合开关：LED 明显变亮",
            "⑪ Exp 2-1：断开开关；将 220Ω 记为 R1，并接入 R2=220Ω",
            "⑫ Exp 2-1：接入 C=1000μF：正极接 R2 右端，负极接负电源轨",
            "⑬ Exp 2-1：闭合开关，LED 立即点亮，电容同时充电",
            "⑭ Exp 2-1：断开开关，电容经 R2、R1 和 LED 放电，LED 缓慢熄灭",
            "⑮ 改为 Exp 2-2：将 R1 左端移到电容正极所在列",
            "⑯ Exp 2-2：闭合开关，电容充电，LED 逐渐变亮",
            "⑰ Exp 2-2：断开开关，电容经 R1 和 LED 放电，LED 较快熄灭"
        ];
        
        let currentStep = 0;

        function updateUI() {
            document.getElementById('step-description').innerText = steps[currentStep];
            document.getElementById('prev-btn').disabled = currentStep === 0;
            document.getElementById('next-btn').disabled = currentStep === steps.length - 1;

            // 显示基础组件：显式绑定步骤，避免 LED / 跳线提前出现
            const revealAt = { step1: 1, step2: 2, step3: 3, step4: 4, step6: 6, step7: 7 };
            Object.entries(revealAt).forEach(([id, step]) => {
                const el = document.getElementById(id);
                if (currentStep >= step) el.classList.add('active'); else el.classList.remove('active');
            });

            // 1kΩ -> 220Ω：使用 active 控制，确保电阻引脚也随步骤正常绘制
            const step5 = document.getElementById('step5');
            const r1_220 = document.getElementById('r1-220-group');
            if (currentStep >= 5 && currentStep <= 9) {
                step5.classList.add('active');
                r1_220.classList.remove('active');
            } else if (currentStep >= 10) {
                step5.classList.remove('active');
                r1_220.classList.add('active');
            } else {
                step5.classList.remove('active');
                r1_220.classList.remove('active');
            }

            // 修改标签 R -> R1
            const r1Label = document.getElementById('r1-label');
            if (currentStep >= 11) r1Label.textContent = 'R1=220Ω';
            else r1Label.textContent = 'R=220Ω';

            // Exp 2 追加组件
            const step11 = document.getElementById('step11');
            if (currentStep >= 11) step11.classList.add('active'); else step11.classList.remove('active');
            const step12 = document.getElementById('step12');
            if (currentStep >= 12) step12.classList.add('active'); else step12.classList.remove('active');

            const r1Body = document.getElementById('r1-body');
            const r1LeftPin = document.getElementById('r1-left-pin');
            const r1RightPin = document.getElementById('r1-right-pin');
            const r1Hole = document.getElementById('r1-target-hole');
            
            if (currentStep >= 15) {
                // 移动到电容正极所在的列 (x=394)
                // 原中心 x=378, 新中心 x=418. 差值 +40
                r1Body.style.transform = 'translate(40px, 0)';
                r1LeftPin.setAttribute('d', 'M 394 110 Q 394 98 396 95');
                r1RightPin.setAttribute('d', 'M 442 110 Q 442 98 440 95');
                // 不再高亮目标孔位
            } else {
                // 初始连接开关端 (x=314)
                r1Body.style.transform = 'translate(0px, 0)';
                r1LeftPin.setAttribute('d', 'M 314 110 Q 314 90 356 95');
                r1RightPin.setAttribute('d', 'M 442 110 Q 442 90 400 95');
                // 不再高亮目标孔位
            }

            // 处理开关滑块
            const slider = document.getElementById('switch-slider');
            const isClosed = [8, 10, 13, 16].includes(currentStep);
            slider.style.transform = isClosed ? 'translateX(16px)' : 'translateX(0px)';

            // 处理多级光效物理模型
            const ledGlow = document.getElementById('led-glow-effect');
            const ledCore = document.getElementById('led-core-effect');
            
            let ledClass = 'off';

            if (currentStep === 8) {
                ledClass = 'on-dim'; // 1kΩ 限流
            } else if (currentStep === 10 || currentStep === 13) {
                ledClass = 'on-bright'; // 220Ω 瞬间高亮
            } else if (currentStep === 14) {
                ledClass = 'fade-slow'; // Exp 2-1：C 经 R2+R1+LED 放电
            } else if (currentStep === 16) {
                ledClass = 'on-delay'; // Exp 2-2：充电节点上升，LED 渐亮
            } else if (currentStep === 17) {
                ledClass = 'fade-fast'; // Exp 2-2：C 经 R1+LED 放电
            }

            ledGlow.className.baseVal = `led-glow ${ledClass}`;
            ledCore.className.baseVal = `led-core ${ledClass}`;

            const flowGroups = ['flow-basic', 'flow-exp21-charge', 'flow-exp21-discharge', 'flow-exp22-steady', 'flow-exp22-charge', 'flow-exp22-discharge'];
            flowGroups.forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('active', 'transient');
                void el.offsetWidth; // 允许瞬态动画在再次进入步骤时重播
            });

            const activateFlow = (id, transient = false) => {
                const el = document.getElementById(id);
                el.classList.add('active');
                if (transient) el.classList.add('transient');
            };

            if (currentStep === 8 || currentStep === 10) {
                activateFlow('flow-basic');
            } else if (currentStep === 13) {
                activateFlow('flow-basic');
                activateFlow('flow-exp21-charge', true);
            } else if (currentStep === 14) {
                activateFlow('flow-exp21-discharge', true);
            } else if (currentStep === 16) {
                activateFlow('flow-exp22-steady');
                activateFlow('flow-exp22-charge', true);
            } else if (currentStep === 17) {
                activateFlow('flow-exp22-discharge', true);
            }
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }

        window.onload = updateUI;
    </script>
</body>
</html>
